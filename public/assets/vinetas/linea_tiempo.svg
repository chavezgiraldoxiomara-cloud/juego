<rect width="1000" height="600" fill="url(#bg)"/>
<text x="500" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#e2e8f0">De la primera mañana al último amanecer</text><line x1="60" y1="300" x2="940" y2="300" stroke="#22d3ee" stroke-width="6"/><rect x="60" y="110" width="280" height="44" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="200.0" y="139" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#22d3ee">PARTE I · un día</text><rect x="350" y="110" width="290" height="44" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="3"/><text x="495.0" y="139" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#a855f7">PARTE II · unos dos meses</text><rect x="650" y="110" width="290" height="44" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text x="795.0" y="139" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">PARTE III · hasta marzo</text><circle cx="110" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="110" y1="240" x2="110" y2="300" stroke="#64748b" stroke-width="2"/><text x="110" y="226" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">Despertar</text><circle cx="280" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="280" y1="360" x2="280" y2="300" stroke="#64748b" stroke-width="2"/><text x="280" y="386" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">La puerta</text><circle cx="420" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="420" y1="240" x2="420" y2="300" stroke="#64748b" stroke-width="2"/><text x="420" y="226" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">La leche</text><circle cx="560" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="560" y1="360" x2="560" y2="300" stroke="#64748b" stroke-width="2"/><text x="560" y="386" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">Los muebles</text><circle cx="610" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="610" y1="240" x2="610" y2="300" stroke="#64748b" stroke-width="2"/><text x="610" y="226" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">La manzana</text><circle cx="720" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="720" y1="360" x2="720" y2="300" stroke="#64748b" stroke-width="2"/><text x="720" y="386" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">Huéspedes</text><circle cx="810" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="810" y1="240" x2="810" y2="300" stroke="#64748b" stroke-width="2"/><text x="810" y="226" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">El violín</text><circle cx="880" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="880" y1="360" x2="880" y2="300" stroke="#64748b" stroke-width="2"/><text x="880" y="386" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">3:00</text><circle cx="930" cy="300" r="13" fill="#f8fafc" stroke="#05070f" stroke-width="3"/><line x1="930" y1="240" x2="930" y2="300" stroke="#64748b" stroke-width="2"/><text x="930" y="226" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0">Tranvía</text><text x="500" y="520" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#94a3b8">Cada parte termina con Gregor saliendo de su cuarto… y siendo devuelto a él.</text>
